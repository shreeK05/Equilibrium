name: Equilibrium CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equilibrium
          POSTGRES_PASSWORD: equilibrium
          POSTGRES_DB: equilibrium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U equilibrium -d equilibrium_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://equilibrium:equilibrium@localhost:5432/equilibrium_test?schema=public
      JWT_SECRET: ci-test-secret-with-more-than-thirty-two-characters
      NODE_ENV: test
      ALLOWED_ORIGINS: '*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: node scripts/use-pg-schema.js
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm test -- --runInBand
      - run: npx jest --config jest.config.js --runInBand
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equilibrium_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://equilibrium-42g8.onrender.com/api/v1
